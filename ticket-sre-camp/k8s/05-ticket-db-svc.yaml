# ════════════════════════════════════════════════════════════
# Headless Service + 常规 Service
# ════════════════════════════════════════════════════════════

---
# ── Headless Service (clusterIP: None) ────────────────
# 配合 StatefulSet 使用，不分配 ClusterIP
# DNS 为每个 Pod 创建独立的 A 记录：
#   ticket-db-0.ticket-db-svc.ticket-sre.svc.cluster.local → 10.244.1.5
#   ticket-db-1.ticket-db-svc.ticket-sre.svc.cluster.local → 10.244.2.3
# 这样其他服务可以通过稳定的 DNS 名称精准访问特定 Pod
apiVersion: v1
kind: Service
metadata:
  name: ticket-db-svc
  namespace: ticket-sre
  labels:
    app: ticket-db
    type: headless
spec:
  # 关键：clusterIP: None 创建 Headless Service
  clusterIP: None
  selector:
    app: ticket-db
  ports:
  - name: http
    port: 8081
    targetPort: 8081
    protocol: TCP

---
# ── 常规 Service (用于读写分离) ────────────────────
# 主库写服务：只路由到 ticket-db-0 (主库)
apiVersion: v1
kind: Service
metadata:
  name: ticket-db-master
  namespace: ticket-sre
  labels:
    app: ticket-db
    role: master
spec:
  type: ClusterIP
  selector:
    app: ticket-db
    # 注意：这里我们通过 Pod label 区分主从
    # StatefulSet 模板中所有 Pod 有相同 label，
    # 所以这里路由到所有 Pod (实际应用中通过其他方式区分主从)
  ports:
  - name: http
    port: 8081
    targetPort: 8081
    protocol: TCP
