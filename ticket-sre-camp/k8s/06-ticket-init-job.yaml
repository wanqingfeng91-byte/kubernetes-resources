# ════════════════════════════════════════════════════════════
# 步骤三·A：抢票前初始化 — Job
# ════════════════════════════════════════════════════════════
# 学到的知识点：
#   1. Job 是一次性任务，执行完就退出 (Pod 进入 Completed 状态)
#   2. 不消耗常驻资源，适合批处理、数据迁移、初始化
#   3. backoffLimit: 失败后重试次数
#   4. ttlSecondsAfterFinished: 完成后保留多久再自动清理
#   5. restartPolicy: Never (失败后创建新 Pod 重试)
#                     OnFailure (在当前 Pod 内重启重试)
# ════════════════════════════════════════════════════════════

apiVersion: batch/v1
kind: Job
metadata:
  name: ticket-init
  namespace: ticket-sre
  labels:
    app: ticket-init
    component: init-job
  annotations:
    description: "抢票系统初始化：注入演唱会门票库存到数据库"

spec:
  # ── 失败重试策略 ────────────────────────────────
  # 最多重试 3 次 (首次 + 3次重试 = 最多 4 次尝试)
  backoffLimit: 3

  # ── 完成后自动清理 ──────────────────────────────
  # Job 和 Pod 在完成后 300 秒自动删除
  # 设置为 0 立即删除，不设置则永久保留
  ttlSecondsAfterFinished: 300

  # ── 完成模式 ────────────────────────────────────
  # NonIndexed: 普通 Job (默认)
  # Indexed: 每个 Pod 有唯一索引，适合分片任务
  completionMode: NonIndexed

  # ── 并行度 ──────────────────────────────────────
  # completions: 1     (成功完成 1 个 Pod 即完成)
  # parallelism: 1     (同时运行 1 个 Pod)
  completions: 1
  parallelism: 1

  template:
    metadata:
      labels:
        app: ticket-init
    spec:
      # ── 关键：Job Pod 的重启策略 ──────────────────
      # Never: Pod 失败后不重启当前容器，而是创建新 Pod
      #        适合无状态任务，每次重试都是全新环境
      # OnFailure: 失败后在当前 Pod 内重启容器
      #            适合需要在同一环境重试的场景
      restartPolicy: Never

      containers:
      - name: ticket-init
        image: ticket-sre/ticket-init-go:latest
        imagePullPolicy: IfNotPresent

        envFrom:
        - configMapRef:
            name: ticket-config

        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
